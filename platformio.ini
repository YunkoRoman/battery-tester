; NanitLib cloned from https://github.com/NanitRobot/NanitLib into ./lib/NanitLib,
; FastLed_Neopixel_Nanit from https://github.com/kireev7/FastLed_Neopixel_Nanit
; into ./lib/FastLed_Neopixel_Nanit (both custom, not on the PlatformIO registry;
; PlatformIO auto-picks up anything under lib/).

[env:nanit_pro]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 9600
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    fastled/FastLED@3.6.0 ; новіші версії конфліктують з FastLed_Neopixel_Nanit (ambiguous memset)
    arduino-libraries/Servo
    adafruit/Adafruit MPU6050
    end2endzone/NonBlockingRTTTL
    adafruit/Adafruit NeoPixel
